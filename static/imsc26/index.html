<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMSC Has Moved</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fafafa;
      --panel: #ffffff;
      --ink: #181c1f;
      --muted: #687076;
      --line: #e4e6e8;
      --line-strong: #cfd4d8;
      --accent: #1f5f8b;
      --radius: 8px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
    }

    main {
      width: min(100%, 520px);
      padding: 24px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 1.28rem;
      line-height: 1.2;
      font-weight: 760;
      letter-spacing: 0;
    }

    p {
      margin: 8px auto 18px;
      max-width: 34rem;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      color: var(--ink);
      font-size: 0.86rem;
      font-weight: 750;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: var(--line-strong);
      background: #f5f6f7;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>We have moved</h1>
    <p>The IMSC 2026 site now lives at imsc.zilin.one.</p>
    <a href="https://imsc.zilin.one/">Go to imsc.zilin.one</a>
  </main>
</body>
</html>
