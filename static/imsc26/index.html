<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMSC Has Moved</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f4ef;
      --panel: #ffffff;
      --ink: #202124;
      --muted: #5f666d;
      --accent: #0b6f6a;
      --accent-strong: #085450;
      --line: #ded9cf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 560px);
      padding: clamp(28px, 6vw, 48px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(32, 33, 36, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.05;
      font-weight: 760;
      letter-spacing: 0;
    }

    p {
      margin: 0 auto 28px;
      max-width: 34rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background: var(--accent-strong);
    }
  </style>
</head>
<body>
  <main>
    <h1>We have moved</h1>
    <p>The IMSC 2026 site now lives at imsc.zilin.one.</p>
    <a href="https://imsc.zilin.one/">Go to imsc.zilin.one</a>
  </main>
</body>
</html>
